name: Documentation issue
description: Report an unclear, incorrect, or missing documentation item.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Do not include credential material, private hostnames, private IPs, payment data, participant data, supplier data, or unredacted logs.
  - type: input
    id: page
    attributes:
      label: Page or file
      description: Link or path to the affected page/file.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is confusing, wrong, missing, or stale?
    validations:
      required: true
  - type: textarea
    id: suggested_correction
    attributes:
      label: Suggested correction
      description: Propose replacement wording or structure if you have it.
    validations:
      required: false
  - type: textarea
    id: reproduction_context
    attributes:
      label: Reproduction context
      description:
        Include command, image tag, hardware, or environment details if applicable.
    validations:
      required: false
